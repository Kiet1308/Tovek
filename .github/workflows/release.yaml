name: Build and Release

on:
  push:
    tags: ['v2-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v2-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-15
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Link the Windows runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Build CLI and local server
        run: cargo +nightly-2026-06-15 build --locked --release --target ${{ matrix.target }} -p luau-lifter -p web-server
      - name: Smoke test and package
        run: python scripts/package_release.py --tag "${{ github.ref_name }}" --platform ${{ matrix.platform }} --bin-dir target/${{ matrix.target }}/release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Prepare release assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Tovek V2 ${RELEASE_TAG#v2-}" --notes-file release/notes.txt
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --clobber
