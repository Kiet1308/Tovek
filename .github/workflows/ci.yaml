name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        # This repository still uses `box_patterns`, which was removed from
        # the moving nightly channel after this known-good toolchain.  Pin the
        # compiler so CI remains reproducible instead of failing before tests
        # run whenever nightly advances.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-12-15
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The repository predates the current nightly rustfmt style and contains
      # unrelated formatting drift. Keep the report visible without making the
      # roadmap CI job fail before its semantic checks; formatting can be
      # migrated in a dedicated, repository-wide change.
      - name: Report formatting status
        run: |
          if cargo +nightly-2024-12-15 fmt --all -- --check; then
            echo "rustfmt: clean"
          else
            echo "::warning::rustfmt reports pre-existing repository-wide drift"
          fi

      - name: Run workspace tests
        run: cargo +nightly-2024-12-15 test --workspace --all-targets

      - name: Check lifter
        run: cargo +nightly-2024-12-15 check -p luau-lifter

      - name: Build release lifter
        run: cargo +nightly-2024-12-15 build --release -p luau-lifter

  # Keep the representative bytecode fixtures and the official Luau parser in
  # the public CI contract.  Rust tests alone cannot catch a source-shaped
  # transformation that is syntactically valid but semantically reordered.
  fixtures:
    name: Fixture and Luau audit
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-12-15

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build lifter
        run: cargo +nightly-2024-12-15 build --release -p luau-lifter

      - name: Build official Luau compiler
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          cmake -S "$RUNNER_TEMP/luau" -B "$RUNNER_TEMP/luau-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/luau-build" --target Luau.Compile.CLI --parallel 2

      - name: Run residual-control fixtures in strict modes
        run: |
          set -euo pipefail
          fixture_root="docs/failure_fixtures/residual_control_flow"
          for mode in default strict; do
            out="${RUNNER_TEMP}/residual-control-${mode}"
            args=()
            if [[ "$mode" == strict ]]; then
              args+=(--strict-no-synthetic-control)
            fi
            log="${RUNNER_TEMP}/residual-control-${mode}.log"
            set +e
            target/release/luau-lifter decompile-folder "$fixture_root" "$out" \
              --key 203 --threads 1 --emit-upvalue-analysis --verbose "${args[@]}" \
              >"$log" 2>&1
            status=$?
            set -e
            # Two fixtures currently exercise the deliberate generic-for
            # suffix-order rejection.  They must remain typed fail-closed
            # outcomes; no fixture may regress to an untyped residual marker.
            test "$status" -eq 1
            test "$(grep -c '^FAIL ' "$log")" -eq 2
            test "$(grep -c 'source_like_unsafe_ForInitSuffixOrder' "$log")" -eq 2
            count=$(find "$out" -type f -name '*.luau' | wc -l)
            test "$count" -eq 5
            if rg -n --glob '*.luau' '(^|[^[:alnum:]_])goto[[:space:]]|controlFlowState|GenericFor(Init|Next)' "$out"; then
              echo 'internal control marker found in fixture output' >&2
              exit 1
            fi
          done

      - name: Parse and compile every fixture output with official Luau
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/luau-build/luau-compile"
          test -x "$compiler"
          for output_root in "$RUNNER_TEMP"/residual-control-*; do
            while IFS= read -r -d '' file; do
              "$compiler" --only-parse "$file" >/dev/null
              "$compiler" --binary -O0 "$file" >/dev/null
            done < <(find "$output_root" -type f -name '*.luau' -print0)
          done

      - name: Upload fixture manifests and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-fixture-audit
          path: |
            ${{ runner.temp }}/residual-control-*/.tovek-analysis/manifest.json
            ${{ runner.temp }}/residual-control-*/**/*.luau
            ${{ runner.temp }}/residual-control-*.log
          if-no-files-found: warn
