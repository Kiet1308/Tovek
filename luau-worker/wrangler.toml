name = "luau-worker"
main = "build/index.js"
workers_dev = true
compatibility_date = "2026-06-15"

[build]
command = "cargo install worker-build --version 0.8.7 --locked && worker-build --release --panic-unwind --no-opt"

# Configure with `wrangler secret put AUTH_SECRET` before deployment. Never
# put credentials in [vars] or commit them to source control.

# read more about configuring your Worker via wrangler.toml at:
# https://developers.cloudflare.com/workers/cli-wrangler/configuration